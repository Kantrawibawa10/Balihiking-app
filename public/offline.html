<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta name="theme-color" content="#166534">

    <title>Offline - Bali Hiking</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #052e16 0%,
                    #14532d 50%,
                    #166534 100%
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .offline-wrapper {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .icon-wrapper {
            width: 96px;
            height: 96px;

            margin: 0 auto 24px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 28px;

            display: flex;
            justify-content: center;
            align-items: center;

            backdrop-filter: blur(10px);
        }

        .icon {
            font-size: 46px;
        }

        h1 {
            font-size: 28px;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            line-height: 1.7;

            color: rgba(255, 255, 255, 0.8);

            margin-bottom: 28px;
        }

        button {
            width: 100%;

            border: 0;
            outline: 0;

            background: white;
            color: #166534;

            padding: 15px 20px;

            border-radius: 14px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 18px;

            font-size: 13px;

            color: rgba(255, 255, 255, 0.65);
        }
    </style>
</head>

<body>

<div class="offline-wrapper">

    <div class="icon-wrapper">
        <div class="icon">
            ⛰️
        </div>
    </div>

    <h1>
        Anda Sedang Offline
    </h1>

    <p>
        Koneksi internet tidak tersedia.
        Beberapa halaman pendakian yang sebelumnya telah
        dibuka masih dapat digunakan secara offline.
    </p>

    <button onclick="window.location.reload()">
        Coba Hubungkan Kembali
    </button>

    <div class="status">
        Sistem Informasi Pendakian Gunung Bali
    </div>

</div>

<script>
    window.addEventListener('online', function () {
        window.location.reload();
    });
</script>

</body>
</html>
